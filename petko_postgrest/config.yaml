name: Petko PostgREST
version: "1.0.1"
slug: petko_postgrest
description: Supabase-compatible REST API for Petko Word Quest
url: https://github.com/dragangagy/petko-word-quest
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  3000/tcp: 8000
ports_description:
  3000/tcp: PostgREST API (Petko)
options:
  postgres_host: local-postgres_latest
  postgres_password: PetkoHA2026!
  jwt_secret: petko-local-jwt-secret-at-least-32-characters
schema:
  postgres_host: str
  postgres_password: password
  jwt_secret: password
build:
  aarch64: Dockerfile
  amd64: Dockerfile
map:
  - config:ro
