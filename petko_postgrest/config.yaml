name: Petko PostgREST
version: "1.0.8"
slug: petko_postgrest
description: Supabase-compatible REST API for Petko Word Quest
url: https://github.com/dragangagy/petko-word-quest
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: true
ports:
  3000/tcp: 8000
ports_description:
  3000/tcp: PostgREST API (Petko)
options:
  postgres_host: 127.0.0.1
  postgres_password: homeassistant
  jwt_secret: petko-local-jwt-secret-at-least-32-characters
schema:
  postgres_host: str
  postgres_password: password
  jwt_secret: password
build:
  amd64: Dockerfile
